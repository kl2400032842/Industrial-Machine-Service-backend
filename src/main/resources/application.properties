spring.application.name=industrial-service-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/industrial_service?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:89103614}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-key-to-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.storage.local-directory=${LOCAL_STORAGE_DIRECTORY:./uploads}

springdoc.swagger-ui.path=/swagger-ui.html

